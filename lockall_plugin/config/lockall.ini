; /data/GoldHEN/lockall.ini
;
; Authentication token for the lockall plugin.
;
; Two accepted formats:
;   token=mysecret
; or just the bare token on the first line:
;   mysecret
;
; If this file is missing the plugin falls back to the default "changeme".
; IMPORTANT: change this from the default before relying on it.
token=changeme
